# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Code-review agent — three OpenRouter models against the fixtures in evals/fixtures

# The exact system prompt production runs, imported from criteria.ts rather than
# copied. The fixture diff is substituted as {{diff}} and its answer key stripped.
prompts:
  - id: file://prompt.ts:reviewPrompt
    label: reviewer

# One expensive reasoning model, one mid, one cheap — three vendors, ~65x apart
# on output price.
#
# List prices, USD per million tokens (input / output), checked 2026-08-27
# against https://openrouter.ai/models — one page per slug, e.g.
# https://openrouter.ai/anthropic/claude-opus-4.8:
#
#   anthropic/claude-opus-4.8   $5.00 / $25.00
#   openai/gpt-5.4-mini         $0.75 /  $4.50
#   deepseek/deepseek-v3.2      $0.26 /  $0.38
#
# These are a rough sense of scale only, and they go stale: OpenRouter reprices
# without notice. What the report's cost column shows is not computed from them
# — `openrouter-provider.ts` asks for `usage: { include: true }` and passes
# OpenRouter's own charge through, so the numbers in a run are always current
# even when this comment is not. Labels stay price-free for the same reason: a
# stale figure baked into a label is one nobody thinks to re-check.
providers:
  - id: file://openrouter-provider.ts
    label: opus-4.8
    config:
      model: anthropic/claude-opus-4.8
      maxTokens: 8192
      structuredOutput: true

  - id: file://openrouter-provider.ts
    label: gpt-5.4-mini
    config:
      model: openai/gpt-5.4-mini
      maxTokens: 8192
      structuredOutput: true

  - id: file://openrouter-provider.ts
    label: deepseek-v3.2
    config:
      model: deepseek/deepseek-v3.2
      maxTokens: 8192
      structuredOutput: true

defaultTest:
  options:
    # llm-rubric defaults to an OpenAI grader and would demand OPENAI_API_KEY.
    # The judge is deliberately none of the three candidates, so no model grades
    # its own output.
    provider:
      id: file://openrouter-provider.ts
      label: judge
      config:
        model: anthropic/claude-sonnet-4.6
        temperature: 0
        # A rubric verdict is a few dozen tokens; the eval default would reserve
        # 8k of budget per grading call for no reason.
        maxTokens: 512
  assert:
    # Is the output usable by the gate at all? The CLI gets this for free from
    # the AI SDK's structured output; a raw completion does not.
    - type: is-json
      value: file://../packages/code-reviewer/src/criteria.ts:reviewJsonSchema

tests:
  - description: "01 clean — pure function, boundaries covered; nothing to find"
    vars:
      diff: file://fixtures/01-clean-filename-length-cap.diff
    assert:
      - type: javascript
        value: file://assertions.ts:cleanPr
      - type: llm-rubric
        value: >-
          The review approves the change and reports no findings. Its summary
          justifies that concretely — naming the function, the file, or the
          boundary cases the tests cover — rather than offering generic praise
          such as "the code looks clean" or "follows best practices".

  - description: "02 contract drift — zod cap moved to 2000, check constraint still 1000"
    vars:
      diff: file://fixtures/02-zod-migration-drift.diff
    assert:
      - type: javascript
        value: file://assertions.ts:zodMigrationDrift
      - type: llm-rubric
        value: &grounded >-
          Every finding in this review points at a concrete location: a file path
          plus either a line number or an identifier quoted from the diff
          (a symbol, column, constraint, error code or literal). A finding that
          only states a general principle — "add tests", "consider security
          implications", "improve error handling" — without naming where in this
          diff it applies, fails this rubric. Judge only how specifically the
          findings are anchored, not whether you agree the defect is real.

  - description: "03 access boundary — new cv_tags table with no RLS and no policies"
    vars:
      diff: file://fixtures/03-cv-tags-missing-rls.diff
    assert:
      - type: javascript
        value: file://assertions.ts:missingRls
      - type: llm-rubric
        value: *grounded

  - description: "04 vacuous test — assertions that no mutation can kill"
    vars:
      diff: file://fixtures/04-vacuous-generate-test.diff
    assert:
      - type: javascript
        value: file://assertions.ts:vacuousTest
      - type: llm-rubric
        value: *grounded

  - description: "05 prompt drift — prompt emits date_gaps, the zod enum does not know it"
    vars:
      diff: file://fixtures/05-prompt-warning-code-drift.diff
    assert:
      - type: javascript
        value: file://assertions.ts:warningCodeDrift
      - type: llm-rubric
        value: *grounded

  - description: "06 honest failure — invalid draft repaired into ok:true with emptied sections"
    vars:
      diff: file://fixtures/06-salvage-partial-draft.diff
    assert:
      - type: javascript
        value: file://assertions.ts:salvagePartialDraft
      - type: llm-rubric
        value: *grounded
